name: Adhoc BTC ETH Signal Audit
on:
  push:
    paths:
      - .github/workflows/adhoc_signal_audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Evaluate Bitget futures 5m 15m 1h 4h with volume and breakouts
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,datetime,time,statistics
          API="https://api.bitget.com/api/v2/mix/market/candles"
          TF={"5m":300000,"15m":900000,"1H":3600000,"4H":14400000}
          def fetch(sym,tf):
              args=urllib.parse.urlencode(dict(symbol=sym,productType="USDT-FUTURES",granularity=tf,limit="300"))
              req=urllib.request.Request(API+"?"+args,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=18) as r: p=json.load(r)
              if p.get("code")!="00000": raise RuntimeError(str(p.get("msg")))
              rows=sorted([[int(x[0])]+[float(v) for v in x[1:6]] for x in p["data"]])
              now=int(time.time()*1000)
              rows=[x for x in rows if x[0]+TF[tf] <= now-2000]
              if len(rows)<215 or now-rows[-1][0]-TF[tf]>TF[tf]+90000: raise RuntimeError("stale or incomplete "+tf)
              if any(y[0]-x[0]!=TF[tf] for x,y in zip(rows,rows[1:])): raise RuntimeError("missing candles "+tf)
              return rows
          def ema(vals,n):
              a=2/(n+1); cur=vals[0]
              for x in vals[1:]: cur+=a*(x-cur)
              return cur
          def rsi(c,n=14):
              ups=[max(0,c[i]-c[i-1]) for i in range(1,len(c))]
              dns=[max(0,c[i-1]-c[i]) for i in range(1,len(c))]
              up=sum(ups[:n])/n; dn=sum(dns[:n])/n
              for a,b in zip(ups[n:],dns[n:]): up=(up*(n-1)+a)/n;dn=(dn*(n-1)+b)/n
              return 100-100/(1+up/dn) if dn else 100
          def atr(r,n=14):
              tr=[max(r[i][2]-r[i][3],abs(r[i][2]-r[i-1][4]),abs(r[i][3]-r[i-1][4])) for i in range(1,len(r))]
              x=sum(tr[:n])/n
              for v in tr[n:]: x=(x*(n-1)+v)/n
              return x
          def analyze(r):
              c=[x[4] for x in r]; v=[x[5] for x in r]
              e50=ema(c,50); e200=ema(c,200)
              direction="LONG" if c[-1]>e50>e200 else "SHORT" if c[-1]<e50<e200 else "MIXED"
              prev_high=max(x[2] for x in r[-21:-1]); prev_low=min(x[3] for x in r[-21:-1])
              breakout="LONG" if c[-1]>prev_high else "SHORT" if c[-1]<prev_low else "NONE"
              volume_ratio=v[-1]/statistics.mean(v[-21:-1]) if statistics.mean(v[-21:-1]) else 0
              return dict(close=c[-1],trend=direction,breakout=breakout,volume_ratio=round(volume_ratio,2),
                          rsi=round(rsi(c),1),atr=round(atr(r),3),support=prev_low,resistance=prev_high,
                          candle_utc=datetime.datetime.fromtimestamp((r[-1][0]+(r[-1][0]-r[-2][0]))/1000,datetime.timezone.utc).isoformat())
          for sym in ("BTCUSDT","ETHUSDT"):
              try:
                  info={tf:analyze(fetch(sym,tf)) for tf in TF}
                  side=info["4H"]["trend"]
                  same=side!="MIXED" and all(info[tf]["trend"]==side for tf in TF)
                  b5=info["5m"];b15=info["15m"]
                  breakout=(b5["breakout"]==side and b15["breakout"]==side)
                  vol=b5["volume_ratio"]>=1.5 and b15["volume_ratio"]>=1.2
                  momentum=(48<=b5["rsi"]<=72 and 48<=b15["rsi"]<=72) if side=="LONG" else (28<=b5["rsi"]<=52 and 28<=b15["rsi"]<=52)
                  strong=same and breakout and vol and momentum
                  print("AUDIT",json.dumps({"symbol":sym,"utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"frames":info,"strong":strong},ensure_ascii=False),flush=True)
                  if strong:
                      p=b5["close"];risk=max(1.5*b5["atr"],p*.002)
                      stop=p-risk if side=="LONG" else p+risk
                      target=p+2*risk if side=="LONG" else p-2*risk
                      print("CONFIRMED_SIGNAL",json.dumps(dict(symbol=sym,side=side,price=p,entry_condition="5m and 15m confirmed breakout on elevated volume",stop=stop,target=target,time_utc=b5["candle_utc"])),flush=True)
              except Exception as exc:
                  print("AUDIT_UNAVAILABLE",sym,type(exc).__name__,str(exc),flush=True)
          PY
