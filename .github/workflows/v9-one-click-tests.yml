name: V9 One-Click Paper Dashboard Tests
'on':
  push:
    branches: [main]
    paths:
      - pc_sanal_v9.py
      - PC_V9_BASLAT.bat
      - tests/test_pc_sanal_v9.py
      - .github/workflows/v9-one-click-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python source offline
        run: python3 -m py_compile pc_sanal_v9.py
      - name: Check safe Windows one-click launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('PC_V9_BASLAT.bat').read_text(encoding='utf-8-sig')
          assert 'pythoncore-3.14-64' in s
          assert 'pc_sanal_v9.py' in s
          assert 'py_compile' in s
          assert 'api/v2/mix/order' not in s
          print('Windows V9 launcher checked (static; Windows runtime not tested)')
          PY
      - name: Run V9 and existing offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live Bitget read-only REST smoke test
        run: |
          python3 - <<'PY'
          import time
          import pc_sanal_v9 as p
          for sym in p.SYMBOLS:
              px,stamp=p.ticker(sym)
              print(sym,px,stamp)
              assert px>0
          for sym in p.SYMBOLS:
              four=p.recent_closed_four(sym,p.utc_ms())
              daily=p.daily_closed(sym,p.utc_ms())
              print(sym,'4h',len(four),'daily',len(daily),
                    'signal',p.signal_from_closed(sym,four,daily)[1])
              assert len(four)>=100 and len(daily)>=550
          fast=p.recent_closed_fifteen(p.utc_ms())
          ev,why=p.fast_signal_from_closed(fast)
          print("BTC 15m",len(fast),"last closed",fast[-1][0],
                "signal",why,"direction",ev and ev['direction'])
          assert len(fast)>=285
          PY
