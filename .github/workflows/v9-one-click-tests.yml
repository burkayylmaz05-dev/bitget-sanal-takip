name: V9 One-Click Paper Dashboard Tests
'on':
  push:
    branches: [main]
    paths:
      - pc_sanal_v9.py
      - PC_V9_BASLAT.bat
      - tests/test_pc_sanal_v9.py
      - .github/workflows/v9-one-click-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python source offline
        run: python3 -m py_compile pc_sanal_v9.py
      - name: Check safe Windows one-click launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('PC_V9_BASLAT.bat').read_text(encoding='utf-8-sig')
          assert 'pythoncore-3.14-64' in s
          assert 'pc_sanal_v9.py' in s
          assert 'py_compile' in s
          assert 'api/v2/mix/order' not in s
          print('Windows V9 launcher checked (static; Windows runtime not tested)')
          PY
      - name: Run V9 and existing offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live Bitget read-only REST smoke test
        run: |
          python3 - <<'PY'
          import time
          import pc_sanal_v9 as p
          for sym in p.SYMBOLS:
              px,stamp=p.ticker(sym)
              print(sym,px,stamp)
              assert px>0
          for sym in p.SYMBOLS:
              four=p.recent_closed_four(sym,p.utc_ms())
              daily=p.daily_closed(sym,p.utc_ms())
              print(sym,'4h',len(four),'daily',len(daily),
                    'signal',p.signal_from_closed(sym,four,daily)[1])
              assert len(four)>=100 and len(daily)>=550
          fast=p.recent_closed_fifteen(p.utc_ms())
          ev,why=p.fast_signal_from_closed(fast)
          print("BTC 15m",len(fast),"last closed",fast[-1][0],
                "signal",why,"direction",ev and ev['direction'])
          assert len(fast)>=285
          PY
      - name: Confirm immediate BTC simulated trade with real Bitget quotes
        run: |
          python3 - <<'PY'
          from tempfile import TemporaryDirectory
          import time
          import pc_sanal_v9 as p
          opened = False
          for attempt in range(4):
              now = p.utc_ms()
              bars = p.recent_closed_fifteen(now)
              px, stamp = p.ticker("BTCUSDT")
              with TemporaryDirectory() as temp:
                  bot = p.Book(folder=temp, now=p.utc_ms)
                  opened = bot.on_quick_ready(bars, p.utc_ms(), px, stamp)
                  if opened:
                      acc = bot.accounts[p.QUICK_ID]
                      trade = acc["position"]
                      print("INSTANT PAPER OPENED",
                            "LONG" if trade["direction"] == 1 else "SHORT",
                            "entry", round(trade["entry"],2),
                            "stop", round(trade["stop"],2),
                            "quantity", round(trade["quantity"],6),
                            "NO REAL ORDER")
                      assert trade["quantity"]*trade["entry"] <= 1000.01
                      assert bot.accounts["BTCUSDT"]["closed"] == 0
                      break
              time.sleep(5)
          assert opened, "Actual closed bar or fresh ticker was unavailable"
          PY
