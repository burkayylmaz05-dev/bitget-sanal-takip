name: One-time BTC ETH confirmation scan
on:
  push:
    paths:
      - '.github/workflows/market-confirmation-scan.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Bitget market candles and evaluate confirmed signals
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, time, statistics
          import bitget_sinyal_takip as m
          import pc_sanal_v9 as p
          results=[]
          for sym in ("BTCUSDT","ETHUSDT"):
              try:
                  signal,trends,reason=m.analyze(sym)
                  price,stamp=p.ticker(sym)
                  candles={tf:m.candles(sym,tf) for tf in m.TF_MS}
                  ratios={}
                  for tf,rows in candles.items():
                      avg=statistics.mean(x[5] for x in rows[-21:-1])
                      ratios[tf]=round(rows[-1][5]/avg,2) if avg else 0
                  hi15=max(r[2] for r in candles["15m"][-21:-1])
                  lo15=min(r[3] for r in candles["15m"][-21:-1])
                  hi1=max(r[2] for r in candles["1H"][-11:-1])
                  lo1=min(r[3] for r in candles["1H"][-11:-1])
                  confirmed=bool(signal) and ratios["15m"]>=1.25 and ratios["1H"]>=1.05
                  if signal and abs(price-signal["entry"])>1.0*signal["atr"]:
                      confirmed=False
                  result={"symbol":sym,"price":price,
                      "quote_time_utc":dt.datetime.fromtimestamp(stamp/1000,dt.timezone.utc).isoformat(),
                      "trends":trends,"volume_ratio":ratios,"15m_support":lo15,
                      "15m_resistance":hi15,"1h_support":lo1,"1h_resistance":hi1,
                      "reason":reason,"confirmed":confirmed,
                      "last_closed_utc":{tf:dt.datetime.fromtimestamp(rows[-1][0]/1000,dt.timezone.utc).isoformat()
                                          for tf,rows in candles.items()}}
                  if confirmed:
                      result["signal"]={"direction":signal["direction"],"entry_condition":"5m closed candle breakout, 15m/1h/4h aligned, volume confirmation","entry":price,"stop":signal["stop"],"target":signal["target"]}
                  results.append(result)
              except Exception as exc:
                  results.append({"symbol":sym,"confirmed":False,"error":type(exc).__name__+": "+str(exc)})
          print("SCAN_SUMMARY="+json.dumps({"time_utc":dt.datetime.now(dt.timezone.utc).isoformat(),"results":results},ensure_ascii=False))
          if not any(r.get("confirmed") for r in results):
              print("NO_CONFIRMED_SIGNAL")
          else:
              for r in results:
                  if r.get("confirmed"):print("STRONG_SIGNAL="+json.dumps(r,ensure_ascii=False))
          PY
