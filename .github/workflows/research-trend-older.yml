name: BTC Older Historical Blind Check

'on':
  push:
    branches: [main]
    paths:
      - research_trend_older.py
      - .github/workflows/research-trend-older.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Compile research modules
        run: python3 -m py_compile research_trend_older.py research_trend_v4.py research_backtest.py
      - name: Run frozen candidate on older 720 days
        run: python3 -u research_trend_older.py
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-old-period-blind-check
          path: research_trend_older_report.json
          if-no-files-found: warn
          retention-days: 30
