name: Bitget BTC ETH Sanal Takip (ucretsiz)

'on':
  # Legacy GitHub paper bot disabled automatically:
  # GitHub cron delays were sending repeated stale 4H Telegram alerts.
  # Windows PC V7 WebSocket bot operates independently.
  # Keep manual run available only for explicit diagnostics.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitget-paper-tracker
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Verify bot safety and unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify Telegram connection and send one test notification
        if: github.event_name == 'workflow_dispatch'
        run: python3 github_telegram_test.py
      - name: Check market and queue notifications (never orders)
        id: poll
        continue-on-error: true
        run: python3 github_runner.py
      - name: Record first actual automated schedule (once)
        if: github.event_name == 'schedule' && steps.poll.outcome == 'success'
        run: python3 github_schedule_probe.py
      - name: Persist paper state before any notification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in bitget_sinyal_v2_durum.json bitget_v3_ab_durum.json bildirim_kuyrugu.json bitget_sanal_islemler_v2.jsonl bitget_v3_ab_islemler.jsonl bitget_v3_ab_rapor.txt github_schedule_verified.json; do
            if test -f "$path"; then git add -f -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update simulated account state [skip ci]"
            git push
          fi
      - name: Send queued Telegram notifications
        run: python3 github_notify.py
      - name: Persist successful sends
        if: always()
        run: |
          git add -f -- bildirim_kuyrugu.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram queue [skip ci]"
            git push
          fi
      - name: Mark incomplete market data as failed
        if: steps.poll.outcome == 'failure'
        run: exit 1
