name: Read-Only BTC ETH Multi-Timeframe Signal Scan
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/market-signal-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read current Bitget futures data without placing orders
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, math, statistics, time, urllib.parse, urllib.request
          BASE="https://api.bitget.com/api/v2/mix/market/"
          FRAMES={"5m":300000,"15m":900000,"1H":3600000,"4H":14400000}
          def request(path,params):
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"BitgetReadOnlyMultiTF/1.0"})
              with urllib.request.urlopen(req,timeout=18) as r:
                  out=json.load(r)
              if out.get("code")!="00000": raise RuntimeError(out.get("msg"))
              return out["data"]
          def ema(values,n):
              k=2/(n+1); v=values[0]
              for x in values[1:]:v+=k*(x-v)
              return v
          def atr(bars,n=14):
              tr=[max(x[2]-x[3],abs(x[2]-bars[i-1][4]),abs(x[3]-bars[i-1][4])) for i,x in enumerate(bars) if i]
              a=sum(tr[:n])/n
              for x in tr[n:]:a=(a*(n-1)+x)/n
              return a
          def rsi(closes,n=14):
              gains=[max(closes[i]-closes[i-1],0) for i in range(1,len(closes))]
              losses=[max(closes[i-1]-closes[i],0) for i in range(1,len(closes))]
              g=sum(gains[:n])/n; l=sum(losses[:n])/n
              for gg,ll in zip(gains[n:],losses[n:]):g=(g*(n-1)+gg)/n;l=(l*(n-1)+ll)/n
              return 100 if l==0 else 100-100/(1+g/l)
          def candles(sym,tf,now):
              rows=request("candles",{"symbol":sym,"productType":"USDT-FUTURES","granularity":tf,"limit":"300"})
              bars=sorted((int(r[0]),*[float(v) for v in r[1:6]]) for r in rows)
              bars=[r for r in bars if r[0]+FRAMES[tf] <= now-3000]
              if len(bars)<210: raise RuntimeError(f"{sym} {tf}: too few closed bars")
              if now-(bars[-1][0]+FRAMES[tf])>FRAMES[tf]+120000:raise RuntimeError(f"{sym} {tf}: stale bars")
              if any(y[0]-x[0]!=FRAMES[tf] for x,y in zip(bars,bars[1:])):raise RuntimeError(f"{sym} {tf}: missing candles")
              return bars
          def scan(sym):
              now=int(time.time()*1000)
              data=request("ticker",{"symbol":sym,"productType":"USDT-FUTURES"})
              d=data[0] if isinstance(data,list) else data
              price=float(d["lastPr"]); stamp=int(d.get("ts") or now)
              if abs(now-stamp)>60000:raise RuntimeError("stale ticker")
              frames={}
              for tf in FRAMES:
                  b=candles(sym,tf,now);c=[x[4] for x in b]
                  high=max(x[2] for x in b[-21:-1]);low=min(x[3] for x in b[-21:-1])
                  avgvol=statistics.mean(x[5] for x in b[-21:-1])
                  volratio=b[-1][5]/avgvol if avgvol>0 else 0
                  e20,e50,e200=ema(c,20),ema(c,50),ema(c,200)
                  direction=1 if c[-1]>e20>e50>e200 else (-1 if c[-1]<e20<e50<e200 else 0)
                  frames[tf]={"trend":direction,"close":c[-1],"high20":high,"low20":low,
                      "volume_ratio":round(volratio,2),"rsi":round(rsi(c),1),
                      "atr":round(atr(b),4),"close_utc":dt.datetime.fromtimestamp((b[-1][0]+FRAMES[tf])/1000,dt.timezone.utc).isoformat()}
              f=frames["15m"]; short=all(frames[t]["trend"]==-1 for t in FRAMES)
              long=all(frames[t]["trend"]==1 for t in FRAMES)
              broke_up=f["close"]>f["high20"] and f["close"]-f["high20"]<=0.8*f["atr"]
              broke_down=f["close"]<f["low20"] and f["low20"]-f["close"]<=0.8*f["atr"]
              vol_ok=f["volume_ratio"]>=1.5 and frames["5m"]["volume_ratio"]>=1.2
              direction=1 if long and broke_up and vol_ok and 52<=f["rsi"]<=72 else (-1 if short and broke_down and vol_ok and 28<=f["rsi"]<=48 else 0)
              risk=1.5*f["atr"]; stop=price-direction*risk if direction else None
              target=price+direction*3*f["atr"] if direction else None
              if direction and (risk/price<0.001 or risk/price>0.03):direction=0
              result={"symbol":sym,"time_utc":dt.datetime.fromtimestamp(stamp/1000,dt.timezone.utc).isoformat(),
                  "price":price,"frames":frames,"strong_signal":("LONG" if direction==1 else "SHORT" if direction==-1 else None)}
              if direction:result.update({"entry_condition":"15m close confirmed breakout with volume and 4 TF trend agreement","stop":round(stop,4),"target":round(target,4)})
              return result
          for sym in ("BTCUSDT","ETHUSDT"):
              try:print("SCAN_RESULT "+json.dumps(scan(sym),separators=(",",":")),flush=True)
              except Exception as e:print("SCAN_ERROR "+sym+" "+type(e).__name__+": "+str(e),flush=True)
          
          PY
