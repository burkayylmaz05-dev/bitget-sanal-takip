name: Bitget Five Fifteen One Four MTF Historical Research
'on':
  push:
    branches: [main]
    paths:
      - research_mtf_5m15m1h4h.py
      - .github/workflows/research-mtf-5m15m1h4h.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: python3 -m py_compile research_mtf_5m15m1h4h.py
      - name: Backtest chronological out-of-sample BTC ETH 5m 15m 1H 4H with realistic fees
        run: python3 -u research_mtf_5m15m1h4h.py
